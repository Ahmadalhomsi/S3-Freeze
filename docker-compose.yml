services:
  s3freeze:
    build: .
    image: s3freeze:latest
    restart: unless-stopped
    environment:
      # Encrypts stored S3 credentials and passphrases (`openssl rand -hex 32`).
      # Keep it safe. If unset, one is generated into the data volume.
      - MASTER_KEY=${MASTER_KEY:-}
      # Optional: create the admin account on first start. Otherwise use the
      # one-time setup token printed in the logs.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_RESET=${ADMIN_RESET:-false}
      - TZ=${TZ:-UTC}
      - PORT=8080
    # Coolify routes traffic through its HTTPS proxy; publishing a host port
    # would bypass it. For plain `docker compose up` locally, use instead:
    #   ports: ["8080:8080"]
    expose:
      - "8080"
    volumes:
      - s3freeze-data:/data
      # Backups written to the built-in "Server disk" destination.
      - s3freeze-backups:/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  s3freeze-data:
  s3freeze-backups:
